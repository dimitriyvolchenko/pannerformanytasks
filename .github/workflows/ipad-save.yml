name: Validate iPad Save and Mega Focus
on:
  push:
    branches: [fix/ipad-save-v3-20261007]
permissions:
  contents: write
concurrency:
  group: ipad-save-v3
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reconstruct exact guarded repair and preserve progress
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip, json, hashlib
          original=Path('index.html').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()=='7615ce25e076f70c24e4edec2f245c7241de3e5f'
          before=hashlib.sha256(Path('progress.json').read_bytes()).hexdigest()
          raw=gzip.decompress(Path('tools/ipad-save/bundle.json.gz').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='eec4a5ee3aa561dc225f69226e0c611fba401f6762aa0c962201f90931fd9702'
          bundle=json.loads(raw);s=original.decode()
          for op in bundle['patches']:
              assert s.count(op['old'])==1,op['old'][:100]
              s=s.replace(op['old'],op['new'])
          assert hashlib.sha256(s.encode()).hexdigest()=='6660169a6ae73bff772e843db4be51de725920e3e22c73b1579af4232c85182e'
          Path('baseline.html').write_bytes(original)
          Path('fixed.html').write_text(s,encoding='utf-8',newline='')
          Path('tools/ipad-save/native.cjs').write_text(bundle['native'],encoding='utf-8')
          assert hashlib.sha256(Path('progress.json').read_bytes()).hexdigest()==before
          print('PASS Hash-verified repair reconstructed; progress.json unchanged')
          PY
      - name: Install pinned native browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Existing desktop and iPhone sync regressions
        run: node tools/ipad-save/existing-native.cjs
      - name: Reproduce original bugs and test fixed iPad Save in both orientations
        run: node tools/ipad-save/native.cjs
      - name: Stage tested HTML object only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess, urllib.request, hashlib
          assert subprocess.check_output(['git','diff','--name-only','--','progress.json']).strip()==b''
          content=Path('fixed.html').read_bytes()
          assert hashlib.sha256(content).hexdigest()=='6660169a6ae73bff772e843db4be51de725920e3e22c73b1579af4232c85182e'
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':content.decode(),'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r:
              result=json.load(r)
          assert result['sha']=='c9ba0bc915226ded54ced66c465e135fcb1f0022'
          print('STAGED_HTML_BLOB='+result['sha'])
          print('PASS No branch or progress file modified by validation')
          PY
